<div class="container">
  <div class="row">
    <div class="col">
      <ul>
        @for(d of navData(); track $index) {
          <li>
            <a [routerLink]="d.link" routerLinkActive="active">{{d.label}}</a>
          </li>
        }
      </ul>
    </div>
  </div>
  <div class="row">
    <router-outlet />
  </div>
</div>
