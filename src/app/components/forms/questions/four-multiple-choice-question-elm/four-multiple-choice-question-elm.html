<form [formGroup]="form">
  <div class="form-group">
    <h2>{{question().question}}</h2>
    @for(k of responseKeys(); track $index) {
      <div class="form-check">
        <input class="form-check-input" type="radio" name="exampleRadios" formControlName="radio" [value]="k">
        <label class="form-check-label">
          {{question().responses[k]}}
        </label>
      </div>
    }
  </div>
</form>
