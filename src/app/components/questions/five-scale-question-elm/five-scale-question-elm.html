<form [formGroup]="form">
<div class="form-group" >
  <h2>{{question().question}}</h2>
  <div class="form-check">
    <input class="form-check-input" type="radio" formControlName="radio" name="radio" [value]="1">
    <label class="form-check-label">
      1
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="radio" formControlName="radio" name="radio" [value]="2">
    <label class="form-check-label">
      2
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="radio" formControlName="radio" name="radio" [value]="3">
    <label class="form-check-label">
      3
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="radio" formControlName="radio" name="radio" [value]="4">
    <label class="form-check-label">
      4
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="radio" formControlName="radio" name="radio" [value]="5">
    <label class="form-check-label">
      5
    </label>
  </div>
</div>
</form>
